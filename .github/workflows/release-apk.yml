name: Release APK (manual)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Nota de release / sprint"
        required: false
        default: "MVP build"

jobs:
  release-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk \
            "dist/IUDigitalRadio-${{ github.sha }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-debug-apk
          path: dist/*.apk
